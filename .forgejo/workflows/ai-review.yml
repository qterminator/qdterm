name: AI Code Review

on:
  # pull_request_target runs the workflow from the TARGET branch (master),
  # not from the PR. A malicious PR cannot alter this file to exfiltrate
  # the AI_REVIEW_TOKEN — only workflow changes already merged to master
  # take effect. The PR's code is fetched read-only for diffing below.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

env:
  VCS__PROVIDER: "GITEA"
  VCS__PIPELINE__OWNER: ${{ forgejo.repository_owner }}
  VCS__PIPELINE__REPO: ${{ forgejo.event.repository.name }}
  VCS__PIPELINE__PULL_NUMBER: ${{ forgejo.event.pull_request.number }}
  VCS__HTTP_CLIENT__API_URL: "http://host.containers.internal:3000/api/v1"
  VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}

  LLM__PROVIDER: "OPENAI"
  LLM__HTTP_CLIENT__API_URL: "http://host.containers.internal:11434/v1"
  LLM__HTTP_CLIENT__API_TOKEN: "not-needed"
  LLM__META__MODEL: "GLM-4.7-Flash-UD-Q4_K_XL.gguf"
  LLM__META__MAX_TOKENS: "8000"
  LLM__META__TEMPERATURE: "0.3"

jobs:
  summary:
    if: ${{ !forgejo.event.pull_request.draft }}
    runs-on: docker
    container:
      image: docker.io/nikitafilonov/ai-review:latest
    steps:
      - name: Fetch PR commits
        env:
          REPO: ${{ forgejo.repository }}
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
        shell: bash
        run: |
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y --no-install-recommends git; }
          git init -q .
          git remote add origin "http://host.containers.internal:3000/${REPO}.git"
          git -c http.extraheader="Authorization: token ${TOKEN}" \
              fetch --depth=100 origin "${BASE_SHA}" "${HEAD_SHA}"
          git checkout -q "${HEAD_SHA}"
      - run: ai-review run-summary

  inline:
    if: ${{ !forgejo.event.pull_request.draft }}
    runs-on: docker
    container:
      image: docker.io/nikitafilonov/ai-review:latest
    steps:
      - name: Fetch PR commits
        env:
          REPO: ${{ forgejo.repository }}
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
        shell: bash
        run: |
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y --no-install-recommends git; }
          git init -q .
          git remote add origin "http://host.containers.internal:3000/${REPO}.git"
          git -c http.extraheader="Authorization: token ${TOKEN}" \
              fetch --depth=100 origin "${BASE_SHA}" "${HEAD_SHA}"
          git checkout -q "${HEAD_SHA}"
      - run: ai-review run-inline

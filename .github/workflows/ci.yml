name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libqtermwidget6-3 libqtermwidget6-3-dev qtermwidget-data \
            g++ cmake qmake6 \
            libnotify-bin xvfb

      - name: Install Python build tooling
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyqt-builder sip pytest pytest-qt setproctitle

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build and install QTermWidget Python bindings
        run: just build-sip

      - name: Verify QTermWidget bindings
        run: python -c "from QTermWidget import QTermWidget; print('OK')"

      - name: Run tests (headless)
        run: |
          QT_QPA_PLATFORM=offscreen pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install linters
        run: pip install ruff
      - name: Compile all Python files
        run: python -m compileall -q qterminator/ tests/
      - name: Ruff
        run: ruff check qterminator/ || true
